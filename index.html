<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Houston Lucas | Open Resume</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        margin: 0;
        padding: 2rem;
        max-width: 760px;
      }
      h1, h2 {
        margin-bottom: 0.5rem;
      }
      section {
        margin-bottom: 1.5rem;
      }
      ul {
        margin-top: 0.5rem;
      }
      .muted {
        opacity: 0.8;
      }
      code {
        font-size: 0.95em;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Houston Lucas</h1>
      <p class="muted">Open resume and projects page.</p>
    </header>

    <section aria-labelledby="projects">
      <h2 id="projects">Projects</h2>
      <ul>
        <li>Add your project links and short summaries here.</li>
      </ul>
    </section>

    <section aria-labelledby="resume">
      <h2 id="resume">Resume</h2>
      <ul>
        <li>Add your role history, skills, and education here.</li>
      </ul>
    </section>

    <section aria-labelledby="tesla-key">
      <h2 id="tesla-key">Tesla Fleet API public key hosting</h2>
      <p>
        Public key path:
        <code>/.well-known/appspecific/com.tesla.3p.public-key.pem</code>
      </p>
    </section>
  </body>
</html>
